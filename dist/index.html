uice","2 garlic cloves, minced","1 tsp Worcestershire sauce","1 tsp Dijon mustard","½ cup Parmesan cheese, grated","½ cup croutons","Salt and pepper to taste"],steps:["Wash and dry the romaine lettuce, then tear into bite-sized pieces.","In a small bowl, whisk together olive oil, lemon juice, garlic, Worcestershire, and Dijon mustard.","Add half the Parmesan to the dressing and whisk until combined.","Place lettuce in a large salad bowl.","Drizzle with dressing and toss well to coat.","Top with remaining Parmesan, croutons, and freshly ground black pepper.","Serve immediately while croutons are still crispy."],tips:"For restaurant-quality croutons, toss bread cubes with olive oil and toast in a 375°F oven for 10 minutes. Make the dressing ahead of time and refrigerate - it actually tastes better after the flavors meld!",isFavorite:!1,createdAt:Date.now()-864e5*5},{id:"sample-3",name:"Spaghetti Carbonara",category:"Dinner",cookTime:25,cookTimeUnit:"minutes",servings:4,ingredients:["1 lb spaghetti","8 oz guanciale or pancetta, diced","4 large egg yolks","2 whole eggs","1 cup Pecorino Romano cheese, finely grated","½ cup Parmesan cheese, finely grated","Freshly ground black pepper","Salt for pasta water"],steps:["Bring a large pot of salted water to boil for the pasta.","Cook spaghetti according to package directions until al dente.","While pasta cooks, sauté guanciale in a large skillet over medium heat until crispy, about 5-7 minutes.","In a bowl, whisk together egg yolks, whole eggs, and both cheeses.","Reserve 1 cup pasta water, then drain the spaghetti.","Remove skillet from heat, add pasta, and toss to combine with the guanciale.","Quickly pour in the egg mixture, tossing constantly and adding pasta water as needed to create a creamy sauce.","Season generously with black pepper and serve immediately."],tips:"The key to carbonara is temperature control - too hot and the eggs scramble, too cold and they won't coat properly. Remove the pan from heat and toss vigorously, adding pasta water gradually to achieve the perfect silky consistency.",isFavorite:!0,createdAt:Date.now()-864e5*2},{id:"sample-4",name:"Chocolate Chip Cookies",category:"Dessert",cookTime:12,cookTimeUnit:"minutes",servings:24,ingredients:["2¼ cups all-purpose flour","1 tsp baking soda","1 tsp salt","1 cup butter, softened","¾ cup granulated sugar","¾ cup packed brown sugar","2 large eggs","2 tsp vanilla extract","2 cups chocolate chips"],steps:["Preheat oven to 375°F (190°C).","Combine flour, baking soda, and salt in a small bowl.","Beat butter and both sugars until creamy in a large mixer bowl.","Add eggs one at a time, beating well after each addition.","Mix in vanilla extract.","Gradually beat in the flour mixture.","Stir in chocolate chips by hand.","Drop rounded tablespoons onto ungreased baking sheets.","Bake for 9-11 minutes or until golden brown.","Cool on baking sheets for 2 minutes, then transfer to wire racks."],tips:"For bakery-style cookies with crispy edges and soft centers, freeze the dough balls for 30 minutes before baking. For extra gooey cookies, use more brown sugar than white and don't overbake!",isFavorite:!0,createdAt:Date.now()-864e5*1},{id:"sample-5",name:"Fresh Guacamole",category:"Snacks",cookTime:10,cookTimeUnit:"minutes",servings:6,ingredients:["3 ripe avocados","1 lime, juiced","1 tsp sea salt","½ cup diced onion","3 tbsp fresh cilantro, chopped","2 roma tomatoes, diced","1 tsp minced garlic","1 pinch ground cayenne pepper"],steps:["Cut avocados in half, remove pits, and scoop flesh into a mixing bowl.","Add lime juice and salt, then mash with a fork to desired consistency.","Fold in onion, cilantro, tomatoes, and garlic.","Add cayenne pepper to taste.","Refrigerate for 1 hour for best flavor.","Serve with tortilla chips or fresh vegetables."],tips:"To keep guacamole from browning, press plastic wrap directly onto the surface to eliminate air contact. Alternatively, save a pit from one of the avocados and place it in the center of the dip - it's an old trick that works!",isFavorite:!1,createdAt:Date.now()-864e5*4},{id:"sample-6",name:"Fresh Mint Lemonade",category:"Drinks",cookTime:15,cookTimeUnit:"minutes",servings:8,ingredients:["1 cup fresh mint leaves","1 cup white sugar","1 cup water (for simple syrup)","6 large lemons, juiced","6 cups cold water","Ice cubes","Lemon slices and mint for garnish"],steps:["Make simple syrup by combining sugar and 1 cup water in a saucepan.","Heat until sugar completely dissolves, then remove from heat.","Add fresh mint leaves to the hot syrup and let steep for 30 minutes.","Strain out mint leaves and let the syrup cool.","Juice the lemons to get about 1½ cups of fresh juice.","In a large pitcher, combine lemon juice, simple syrup, and 6 cups cold water.","Stir well and taste - adjust sweetness if needed.","Serve over ice with lemon slices and fresh mint."],tips:"For a less sweet lemonade, reduce the simple syrup by half. For sparkling lemonade, replace 2 cups of water with club soda. Fresh mint makes a huge difference compared to dried - don't skip it!",isFavorite:!1,createdAt:Date.now()-864e5*6}],Sh=()=>{try{return!localStorage.getItem("recipe-app-storage")}catch{return!0}},Gl=vh()(xh((T,v)=>({recipes:[],theme:"light",searchQuery:"",selectedCategory:"All",sortBy:"recent",sortOrder:"desc",showFavoritesOnly:!1,recentRecipeIds:[],addRecipe:x=>{const r={...x,id:ph(),createdAt:Date.now(),isFavorite:!1};T(z=>({recipes:[r,...z.recipes]}))},updateRecipe:(x,r)=>{T(z=>({recipes:z.recipes.map(A=>A.id===x?{...A,...r}:A)}))},deleteRecipe:x=>{T(r=>({recipes:r.recipes.filter(z=>z.id!==x),recentRecipeIds:r.recentRecipeIds.filter(z=>z!==x)}))},toggleFavorite:x=>{T(r=>({recipes:r.recipes.map(z=>z.id===x?{...z,isFavorite:!z.isFavorite}:z)}))},markAsCooked:x=>{T(r=>({recipes:r.recipes.map(z=>z.id===x?{...z,lastCooked:Date.now()}:z),recentRecipeIds:[x,...r.recentRecipeIds.filter(z=>z!==x)].slice(0,5)}))},setSearchQuery:x=>T({searchQuery:x}),setSelectedCategory:x=>T({selectedC
